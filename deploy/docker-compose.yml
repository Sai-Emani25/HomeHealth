
version: '3.8'

services:
  influxdb:
    image: influxdb:latest
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb
    environment:
      - INFLUXDB_DB=homehealth
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=secret_password

  node-api:
    build: 
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "3000:3000"
    depends_on:
      - influxdb
    environment:
      - DB_URL=http://influxdb:8086
      - AWS_IOT_ENDPOINT=xxxxxx.iot.ap-south-1.amazonaws.com

  fastapi-fl:
    build: 
      context: .
      dockerfile: Dockerfile.ml
    ports:
      - "8000:8000"
    environment:
      - MODEL_REGISTRY=/models

volumes:
  influxdb_data:
